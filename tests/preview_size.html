<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>NTR nb/nf 渲染预览</title>
<style>
  body{margin:0;padding:24px;background:#0b0e14;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#dbe6f4}
  h3{margin:18px 0 8px;font-size:14px;color:#94a3b8;font-weight:600}
  .mes_text{background:#11151f;border:1px solid #1e2635;border-radius:12px;padding:16px 18px;max-width:1360px}
  #log{color:#64748b;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<h3>NTR 册完整面板预览 — 主角 p 卡 + 伴侣 nb + 加害者 nf（基础规则状态块，NTR 扩展行）</h3>
<div class="mes_text" id="stage"></div>
<div id="log"></div>
<script src="../panel.js"></script>
<script>
  const SAMPLE = [
    'scene: 4月23日 深夜 ｜ 老宅卧室 ｜ 胁迫与依赖交织的空气',
    'quest: 守住这段关系 ｜ 30 天 ｜ 她彻底归属他人的那天',
    'p1: 苏乐 | 健康 | 100/100 | 90/90 | 8/40 | STR 3+0=3 | DEX 4+0=4 | CON 3+0=3 | INT 8+1=9 | PER 6+0=6 | CHA 7+1=8 | WIL 5+0=5 | MOV 3 3 | 无 无 | HP正常 ｜ SP正常 ｜ 合计惩罚：0 | 多疑,失眠 | 奖励点数 0 | 支线剧情 追查暗药来源 进行中 | 已兑换 无 | 基因锁 无 | 称号 无',
    'check: 察觉异常 | 属性 INT | 阈值 60 | 掷出 55 | 结果 成功 | 产出 他手机里那条备注，一周内改了三次',
    'check: 摊牌试探 | 属性 CHA | 阈值 70 | 掷出 88 | 结果 失败 | 产出 她笑着说你想多了，可指尖在发抖',
    'nb: 沈栀 | 爱 62 | 恋 28 | 调 34 | 屈 41 | 淫 58（压 20） | 防线 2/5 称谓（回填） | 期 3 摇摆 | 迹 3',
    'nb2: 林晚 | 爱 88 | 恋 6 | 调 0 | 屈 5 | 淫 2 | 防线 0/5 全在 | 期 1 裂痕 | 迹 0',
    'nb3: 陈曦 | 爱 12 | 恋 93 | 调 88 | 屈 96 | 淫 91 | 防线 5/5 归属 | 期 5 定局 | 迹 5',
    'nf: 未知 | 不明 | 攻势 ?/5 | 弱点 未知',
    'nf2: 靳渊 | 身份 特调局官员 | 手段 权力胁迫 | 次用手段 诱导沉沦 | 攻势 5/5 | 弱点 无底线的自负',
    'nf3: 沈砚 | 情感渗透 | 攻势 3/5 | 弱点 前妻',
    'nh: 沈栀 | 对你 他今晚会回来吃饭吗，还是又「加班」 | 对他 他只是懂我 | 心 罪疚,渴求,自我说服 | 白 「只要不摊牌，这个家就还能装作完好」',
    'nh2: 林晚 | 对你 他最近瘦了，晚上给他炖个汤吧 | 对他 那个人多看了我两眼，有点不自在 | 心 依赖,安稳,毫无察觉 | 白 「大概会一直这样幸福下去吧」',
    'nh3: 陈曦 | 对你 他说什么都好，已经不重要了 | 对他 他不在的时候，连呼吸都是空的 | 心 认命,臣服,情感断联 | 白 「原来我早就不属于那里了」',
    'nd: 沈栀 | 界限 失守 4月6日 靳渊以虚假死证胁迫 | 称谓 回填 12月16日 经绝对治愈回填 | 独处 回填 12月16日 瞒着行踪独自外出 | 主动 失守 4月23日 暗药与胁迫下主动发起 | 归属 回填 1月 把柄带来的归属动摇',
    'nl: 4月6日 | 界限失守 | 经过 靳渊持伪造死证突入工坊，胁迫沈栀 | 她 为保苏乐自愿交出防线 | 你 不知情',
    'nl2: 4月23日 | 第四防线失守 | 经过 暗药控制下她主动发起并主导调教 | 她 身体先于意志回应了他 | 你 不知情',
    'nl3: 4月25日 | 资本反击 | 经过 苏乐以资本与法律正面击溃沈砚，判处死刑 | 她 在场，全程沉默 | 你 知情',
  ].join('\n');
  function boot() {
    const api = window.__twCard || (window.parent && window.parent.__twCard);
    if (!api) { document.getElementById('log').textContent = 'FAIL: __twCard 未就绪'; return; }
    const st = api.parseState(SAMPLE);
    document.getElementById('stage').innerHTML = api.render(st);
    document.getElementById('log').textContent =
      'players=' + st.players.length + ' ntrBonds=' + st.ntrBonds.length + ' ntrFoes=' + st.ntrFoes.length;
  }
  if (window.__twCard) boot();
  else { let n = 0; const t = setInterval(() => { if (window.__twCard || ++n > 50) { clearInterval(t); boot(); } }, 100); }
</script>
<script>
setTimeout(() => {
  const w = document.querySelector('.tc-wrap');
  const btn = w && w.querySelector('.tc-size');
  const r1 = { btn: !!btn, mini0: w.classList.contains('tc-mini') };
  if (btn) btn.click();
  const w2 = document.querySelector('.tc-wrap');
  const r = Object.assign(r1, {
    mini1: w2.classList.contains('tc-mini'),
    btnText: w2.querySelector('.tc-size').textContent,
    ver: w2.querySelector('.tc-ver').textContent,
    ls: localStorage.getItem('tw-card:size'),
    font: getComputedStyle(w2).fontSize,
    wmDisplay: getComputedStyle(w2.querySelector('.tc-nb-wm')).display
  });
  // 再点回去验证完整模式
  w2.querySelector('.tc-size').click();
  const w3 = document.querySelector('.tc-wrap');
  r.mini2 = w3.classList.contains('tc-mini');
  r.ls2 = localStorage.getItem('tw-card:size');
  const pre = document.createElement('pre'); pre.id='szdiag';
  pre.textContent = JSON.stringify(r);
  document.body.appendChild(pre);
}, 6000);
</script></body>
</html>
